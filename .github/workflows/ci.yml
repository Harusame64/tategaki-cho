# Unit tests and both debug builds on every change. The E2E tests need an emulator and are run
# locally (docs/e2e.md); dependency bumps are judged by that run, not by this one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK (ANDROID_HOME); the Android Gradle plugin installs
      # platform 36 if it is missing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and build
        run: ./gradlew :core:test :app:testPublicE2eUnitTest :app:assemblePublicDebug :app:assemblePersonalDebug
