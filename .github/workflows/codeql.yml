name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Fork PRs get a read-only token, so the upload of results fails. The push to main after the
    # merge still runs the full analysis, so nothing lands unscanned.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode none: CodeQL reads the Java sources without a Gradle build, so the
          # analysis does not need the Android SDK.
          - language: java-kotlin
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Security queries only. The quality suite reported style notes on the copy of AozoraEpub3 in core/,
          # which is kept close to upstream on purpose, and on the tests.
          queries: security-extended
          # The tests are not shipped in the app.
          config: |
            paths-ignore:
              - app/src/test
              - app/src/androidTest
              - core/src/test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
