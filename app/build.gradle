plugins {
    id "com.android.application"
}

// The release key stays out of git: its path, alias and passwords come from environment variables or from
// local.properties (also untracked). A release build without them stops with the list of what is missing.
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def signingValue = { String key -> System.getenv(key) ?: localProps.getProperty(key) }
def signingKeys = ["TGC_KEYSTORE", "TGC_KEYSTORE_PASSWORD", "TGC_KEY_ALIAS", "TGC_KEY_PASSWORD"]
def signingMissing = signingKeys.findAll { !signingValue(it) }

android {
    namespace "jp.harusame.aozorareader"
    compileSdk 36

    defaultConfig {
        applicationId "jp.harusame.tategakicho"
        minSdk 33
        targetSdk 36
        // versionCode only goes up, by one per published build (Play requires it too); tags are v<versionName>.
        versionCode 8
        versionName "0.1.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // The E2E tests run against their own build (…tategakicho.e2e, …tategakicho.personal.e2e), so they can sit
    // beside the real app on a phone without touching its shelf. `./gradlew :app:connectedPublicE2eAndroidTest
    // :app:connectedPersonalE2eAndroidTest` on an emulator or a phone.
    signingConfigs {
        release {
            if (signingMissing.isEmpty()) {
                storeFile file(signingValue("TGC_KEYSTORE"))
                storePassword signingValue("TGC_KEYSTORE_PASSWORD")
                keyAlias signingValue("TGC_KEY_ALIAS")
                keyPassword signingValue("TGC_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        e2e {
            initWith debug
            applicationIdSuffix ".e2e"
            matchingFallbacks = ["debug"]
        }
    }
    testBuildType "e2e"

    // Two builds from one source. public: the store build — no 全話を保存, and a work deleted or made
    // private on its site has its kept text dropped once that is confirmed. personal: for the family, by APK —
    // 全話を保存, and kept text stays. personal sits beside public on a phone (its own id and name).
    flavorDimensions "dist"
    productFlavors {
        create("public") {
            dimension "dist"
            buildConfigField "boolean", "FULL_SAVE", "false"
            buildConfigField "boolean", "DROP_GONE", "true"
        }
        create("personal") {
            dimension "dist"
            applicationIdSuffix ".personal"
            buildConfigField "boolean", "FULL_SAVE", "true"
            buildConfigField "boolean", "DROP_GONE", "false"
        }
    }
    buildFeatures {
        buildConfig true
    }

    // The licence screen reads the repository's own notices, copied in at build time (licences/ in the assets),
    // so the APK carries the same text as the repository and there is no second copy to keep in step.
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/licenceAssets").get().asFile)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // JVM tests of the app's own logic (URLs, the network door, the page template, CSV); Android calls they
    // reach return defaults.
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all { useJUnitPlatform() }
    }
}

def copyLicences = tasks.register("copyLicences", Sync) {
    from(rootProject.file("NOTICE"))
    from(rootProject.file("LICENSE"))
    from(rootProject.file("THIRD-PARTY-NOTICES.txt"))
    from(rootProject.file("licenses"))
    into(layout.buildDirectory.dir("generated/licenceAssets/licences"))
}
tasks.named("preBuild") { dependsOn(copyLicences) }

gradle.taskGraph.whenReady { graph ->
    def release = graph.allTasks.find { it.project == project && it.name ==~ /(assemble|bundle|package)\w*Release/ }
    if (release && !signingMissing.isEmpty()) {
        throw new GradleException("${release.path} needs the release key. Set ${signingMissing.join(', ')} " +
                "as environment variables or in local.properties (see docs/release.md).")
    }
}

dependencies {
    implementation project(":core")
    // The check for new episodes runs in the background with WorkManager.
    implementation "androidx.work:work-runtime:2.12.0"
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.json:json:20260814"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    // Google's accessibility checks (touch targets, contrast, labels) on the native screens: A11yTest.
    androidTestImplementation "androidx.test.espresso:espresso-accessibility:3.6.1"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.4.0"
    androidTestImplementation "androidx.work:work-testing:2.12.0"
}
