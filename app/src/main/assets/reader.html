/** 縦書き テキスト用スタイル */
@page {

padding: 0;
writing-mode: vertical-rl;

/** 太字、ゴシック */
.gtc {

.custom_parameter_block {

@charset "utf-8";
@namespace "http://www.w3.org/1999/xhtml";

/** 縦書き用 ページ設定以外の基本部分 */
p {
text-align: justify;
margin: 0;
}
:link { color: #00C; background: transparent; }
:visited { color: #609; background: transparent; }
a:active { color: #C00; background: transparent; }
a:link img, a:visited img { border-style: none; }

/* 画像 */
span.img {
clear: both;
display: inline-block;
max-width: 100%;
max-height: 100%;
line-height: 1.2em;
writing-mode: horizontal-tb;
-webkit-writing-mode: horizontal-tb;
-epub-writing-mode: horizontal-tb;
}
span.img img {
min-width: 1em;
}
/* 単ページ横100% */
.fit_w span.img {
width: 100%;
}
/* 単ページ縦100% */
.fit_h span.img {
height: 100%;
}
/* 回り込み 上 */
span.img.ft {
display: inline;
float: left;
clear: left;
padding: 0 .5em .5em .5em;
}
/* 回り込み 下 */
span.img.fb {
display: inline;
float: right;
clear: right;
padding: .5em .5em 0 .5em;
}
span.img.fw img {
width: 100%;
}
span.img.fh img {
height: 100%;
}
/* 単ページfloat表示 */
span.img.fpage {
display: block;
float: left;
clear: both;
width: 100%;
height: 100%;
text-align: center;
vertical-align: center;
padding-bottom: 100%;
}
/* 画像float表示 */
span.img.fblk {
display: block;
float:left;
padding: 0 .5em 100% .5em;
}
/* キャプション */
span.img .caption {
display: block;
text-align: center;
font-size: 85%;
margin-bottom: .5em;
}

/* floatクリア用 */
p.clear { clear:both; width:0; line-height:0;}
p.clear_r { clear:right; width:0; line-height:0;}
p.clear_l { clear:left; width:0; line-height:0;}

hr { margin: .5em 0 .5em 0; }

/* 取り消し線 */
.strike { text-decoration:line-through; }
.dbl_strike { text-decoration:line-through; }

:root{--ff:"Noto Serif CJK JP","Noto Serif JP",serif;--bg:#fbf8f1;--fg:#222;--sub:#6b6b6b;--card:#faf8f3;--line:#e4e0d6;--edge:#8f8b81;--link:#1a5fb4;--fs:19px}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);-webkit-user-select:none;user-select:none}
.pagebox{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;position:absolute;overflow:hidden;will-change:transform;
 font-size:var(--fs);line-height:var(--lh,2);font-family:var(--ff);column-fill:auto}
/* Bundled fonts (SIL OFL 1.1; licences beside them in assets/fonts). */
@font-face{font-family:"BIZ UDMincho";src:url("fonts/BIZUDMincho-Regular.ttf")}
@font-face{font-family:"Shippori Mincho";src:url("fonts/ShipporiMincho-Regular.ttf")}
.pagebox p{margin:0}
section.ep+section.ep{break-before:column}
.tcy span{text-combine-upright:all;-webkit-text-combine:horizontal}
span.sesame{text-emphasis-position:over right}
/* Ruby (and なろう's 傍点, which is ruby of ・) fits in the half-leading of line-height 2, so a line
   with ruby is no wider than the others. Below 2 (行間 in Aa) such a line is a little wider. */
.pagebox rt{font-size:.5em;line-height:1}
/* aozora's 前書き and 後書き boxes fix their colours for a white page; here they follow the theme. */
.pagebox .introduction{color:var(--sub);border-top-color:var(--line)}
.pagebox .postscript{color:var(--fg);border-top-color:var(--sub)}
#peer{visibility:hidden}
#pg{writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;position:fixed;bottom:22px;left:0;right:0;text-align:center;font:12px sans-serif;color:var(--sub)}
#credit{position:fixed;left:22px;bottom:22px;font:12px sans-serif;color:var(--sub);writing-mode:horizontal-tb;
  max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info{display:none;position:fixed;inset:0;writing-mode:horizontal-tb;z-index:9;font:15px/1.6 sans-serif;color:var(--fg)}
#info.on{display:block}
#info .topbar,#info .botbar{position:absolute;left:0;right:0;background:var(--card);box-shadow:0 0 6px rgba(0,0,0,.18);box-sizing:border-box}
#info .topbar{top:0;display:flex;align-items:center;gap:8px;padding:10px 12px}
#info .topbar .wt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}
#info .botbar{bottom:0;padding:10px 16px 16px}
#info .sheet{display:none;position:absolute;left:0;right:0;bottom:0;background:var(--card);padding:20px 22px 28px;box-sizing:border-box;
  box-shadow:0 -2px 10px rgba(0,0,0,.25);max-height:88%;overflow-y:auto}
#info.work .sheet.w,#info.disp .sheet.d{display:block}
#info.work .botbar,#info.disp .botbar{display:none}
#info .t{font-size:17px;font-weight:bold;margin-bottom:4px}
#info .a{color:var(--sub);margin-bottom:14px}
#info a{display:block;padding:13px 0;color:var(--link);text-decoration:none;border-top:1px solid var(--line)}
#info .note{margin-top:10px;font-size:12px;color:var(--sub)}
#info .disp{margin:0}
#info .row{display:flex;align-items:center;gap:10px;margin:6px 0}
/* The label never breaks (上下余白 at a large system font size broke into two lines); the buttons wrap beside it. */
#info .row .k{flex:0 0 auto;min-width:4.5em;white-space:nowrap;color:var(--sub);font-size:13px}
/* Buttons are 48px high, Android's smallest comfortable touch target; their edge is 3:1 on the card. */
/* At least 48px high, and as high as the text needs: a fixed height let a wrapped label spill out of its button. The
   text itself does not wrap; a row's buttons wrap instead (.opts). */
#info button{font:15px sans-serif;border:1px solid var(--edge);border-radius:6px;background:transparent;color:var(--fg);

  padding-left:8px;-webkit-touch-callout:none}

#info .bar.ep span{color:var(--link);font-weight:bold}

/* A chapter is a box: a band in the rule colour, then its episodes a step in. The band of the chapter scrolled
   into stays at the top of the list, and the box's end pushes it off, so only that chapter's band is ever stuck.

#toc .ch{position:sticky;top:-1px;z-index:1;padding:10px 18px;font-size:15px;font-weight:bold;color:var(--fg);background:var(--line)}

#toc .ep.kept::after{content:"保存済み";float:right;margin-left:10px;font-size:11px;font-weight:normal;color:var(--sub)}

<script>var INFO=%%INFO%%, START=%%START%%, SHARE=%%SHARE%%, PREFS=%%PREFS%%;</script><script>

    white:{bg:'#ffffff',fg:'#111',sub:'#6b6b6b',card:'#ffffff',line:'#e2e2e2',edge:'#8f8f8f',link:'#1a5fb4'},
    sepia:{bg:'#f1e7d0',fg:'#4a3b2a',sub:'#6e5f48',card:'#efe4cb',line:'#d9cbaa',edge:'#8a7a5e',link:'#7a4b12'},

  // At least one zone is the menu, or the bars could not be shown.

  var prefs={theme:'kinari',fs:19,ahead:1,vol:false,bar:false,font:'serif',pack:true,indent:false,upright:false,lh:2,mx:'m',my:'m',guided:false,ephint:0,edge:true,buzz:false,

  h+='<div class="sheet d"><div class="disp"><div class="row"><span class="k">背景</span><div class="opts">'
    +THEME_ORDER.map(function(k){return '<button class="sw" data-theme="'+k+'" style="background:'+THEMES[k].bg+'"></button>';}).join('')
