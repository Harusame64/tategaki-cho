plugins {
    id "java-library"
}

java {
    // Android runs Java 17 bytecode; aozora is written for 21, so the copy has to compile as 17.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = "UTF-8"
}

dependencies {
    implementation "org.jsoup:jsoup:1.23.2"
    // Android has org.json in the platform; core compiles and tests against the same API.
    compileOnly "org.json:json:20260814"
    testImplementation "org.json:json:20260814"
    implementation "org.apache.commons:commons-lang3:3.21.0"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "org.apache.commons:commons-collections4:4.6.0"
    implementation "commons-io:commons-io:2.22.0"
    implementation "commons-cli:commons-cli:1.11.0"
    implementation "org.apache.velocity:velocity-engine-core:2.4.1"
    implementation "org.slf4j:slf4j-api:2.0.20"
}

dependencies {
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
    testLogging { events "failed"; exceptionFormat "full"; showStandardStreams = true }
    // AsciiClassesTest and AtomicWritesTest read the app's sources: without them as an input, a change there left them up to date.
    inputs.dir("../app/src/main/java").withPropertyName("appSources")
}
