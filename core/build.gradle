plugins {
    id "java-library"
}

java {
    // Android runs Java 17 bytecode; aozora is written for 21, so the copy has to compile as 17.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = "UTF-8"
}

dependencies {
    implementation "org.jsoup:jsoup:1.23.2"
    // Android has org.json in the platform; core compiles and tests against the same API.
    compileOnly "org.json:json:20250517"
    testImplementation "org.json:json:20250517"
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "org.apache.commons:commons-collections4:4.5.0"
    implementation "commons-io:commons-io:2.20.0"
    implementation "commons-cli:commons-cli:1.11.0"
    implementation "com.github.junrar:junrar:7.6.1"
    implementation "org.apache.velocity:velocity-engine-core:2.4.1"
    implementation "org.slf4j:slf4j-api:2.0.17"
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
    testLogging { events "failed"; exceptionFormat "full"; showStandardStreams = true }
}
