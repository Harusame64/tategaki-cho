    <h1 class="p-novel__title p-novel__title--rensai">第一話　電波の届かない駅</h1>
    <div class="js-novel-text p-novel__text">
      <p id="L1">　朝の七時十二分、<ruby>電車<rp>(</rp><rt>でんしゃ</rt><rp>)</rp></ruby>は地下へ潜った。</p>
      <p id="L2">　――それでも、物語は止まらない。</p>
      <p id="L3"><br></p>
      <p id="L4">「あと3駅だよ!?」と彼女は言った。時刻は7時12分、まだ11駅ある。</p>
      <p id="L6">　傍点の行の前の行。</p>
      <p id="L7">　「<ruby>本<rp>(</rp><rt>・</rt><rp>)</rp></ruby><ruby>当<rp>(</rp><rt>・</rt><rp>)</rp></ruby><ruby>に<rp>(</rp><rt>・</rt><rp>)</rp></ruby>そうなの？」と、傍点の行。</p>
      <p id="L8">　傍点の行の後の行。</p>
      <p id="L9">　<ruby>改札<rp>(</rp><rt>かいさつ</rt><rp>)</rp></ruby>を抜けると、ルビの行。</p>
      <p id="L10">　ルビの行の後の行。</p>
      <p id="L5">　……そして、次の駅の灯りが近づいてきた。</p>
